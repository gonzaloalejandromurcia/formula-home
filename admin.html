<script>

FH.wire();
const sb = FH.sb;
let STATUS = 'pending';
window.onLangChange = () => { if(document.getElementById('ad-list')) load(); };
(async () => {
  const u = await FH.requireAuth(); if(!u) return;
  const p = await FH.profile();
  const root = document.getElementById('ad-root');
  if(!p || !p.is_admin){ root.innerHTML = '<p class="muted">' + FH.esc(t('p.ad.denied')) + '</p>'; return; }
  root.innerHTML = '<div class="stat-row" id="stats"></div><div class="tabs" id="ad-tabs" style="flex-wrap:wrap">' +
    ['pending', 'approved', 'rejected', 'paused'].map(s => '<button class="tab' + (s === STATUS ? ' active' : '') + '" data-s="' + s + '">' + FH.esc(t('st.' + s)) + '</button>').join('') +
    '</div><div id="ad-list"></div>';
  document.getElementById('ad-tabs').addEventListener('click', (e) => {
    const b = e.target.closest('.tab'); if(!b) return;
    STATUS = b.dataset.s; document.querySelectorAll('#ad-tabs .tab').forEach(x => x.classList.toggle('active', x === b)); load();
  });
  document.getElementById('ad-list').addEventListener('click', async (e) => {
    const b = e.target.closest('button[data-act]'); if(!b) return;
    const { error } = await sb.from('hosts').update({ status: b.dataset.act }).eq('id', b.dataset.id);
    if(error){ alert(FH.errText(error)); return; }
    load(); stats();
  });
  stats(); load();
})();
async function stats(){
  const { data } = await sb.rpc('admin_stats');
  if(!data) return;
  const sum = o => Object.values(o || {}).reduce((a, b) => a + b, 0);
  const box = document.getElementById('stats');
  box.innerHTML = '<div class="stat"><b>' + data.users + '</b><span>' + FH.esc(t('p.ad.users')) + '</span></div>' +
    '<div class="stat"><b>' + sum(data.listings) + '</b><span>' + FH.esc(t('p.ad.listings')) + ' (' + ((data.listings || {}).pending || 0) + ' ' + FH.esc(t('st.pending')) + ')</span></div>' +
    '<div class="stat"><b>' + sum(data.bookings) + '</b><span>' + FH.esc(t('p.ad.bookings')) + '</span></div>';
}
async function load(){
  const { data, error } = await sb.rpc('admin_listings', { p_status: STATUS });
  const box = document.getElementById('ad-list');
  if(error){ box.textContent = FH.errText(error); return; }
  if(!data || !data.length){ box.innerHTML = '<p class="muted">' + FH.esc(t('p.ad.none')) + '</p>'; return; }
  box.innerHTML = data.map(h => '<div class="item"><div class="item-top"><div><h4>' + FH.esc(h.title || h.name) + '</h4>' +
    '<div class="sub">' + FH.esc(h.city) + (h.country ? ', ' + FH.esc(h.country) : '') + ' · ' + FH.esc(h.circuit) + '</div>' +
    '<div class="sub">' + FH.esc(FH.money(h.price_per_night || 0, h.currency)) + ' · ' + FH.esc(t('p.ad.owner')) + ': ' + FH.esc(h.owner_email || t('p.ad.legacy')) + '</div></div>' + FH.badge(h.status) + '</div>' +
    (h.description ? '<div class="msg">' + FH.esc(h.description.slice(0, 300)) + '</div>' : '') +
    ((h.photo_urls || []).length ? '<div class="thumb-row">' + h.photo_urls.map(u => '<div class="thumb"><img src="' + FH.esc(u) + '" alt=""></div>').join('') + '</div>' : '') +
    '<div class="btn-row">' +
      (h.status !== 'approved' ? '<button class="btn btn-small" data-act="approved" data-id="' + h.id + '">' + FH.esc(t('p.ad.approve')) + '</button>' : '') +
      (h.status !== 'rejected' ? '<button class="btn btn-danger btn-small" data-act="rejected" data-id="' + h.id + '">' + FH.esc(t('p.ad.reject')) + '</button>' : '') +
      '<a class="btn btn-ghost btn-small" href="listing.html?id=' + h.id + '">' + FH.esc(t('p.hp.view')) + '</a>' +
    '</div></div>').join('');
}

</script>
